<!DOCTYPE html>
<html>
<head>
    <title>LED Matrix Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script>
        async function loadSettings() {
            const res = await fetch("/get_settings");
            const settings = await res.json();

            document.getElementById("themeSelect").value = settings.theme || "";
            document.getElementById("duration").value = settings.duration || 2;
            document.getElementById("sleepEnable").checked = settings.sleep_enable || false;
            document.getElementById("sleepStart").value = settings.sleep_range?.start || "00:00";
            document.getElementById("sleepEnd").value = settings.sleep_range?.end || "09:00";
        }

        async function saveSettings() {
            const payload = {
                theme: document.getElementById("themeSelect").value,
                duration: parseFloat(document.getElementById("duration").value),
                sleep_enable: document.getElementById("sleepEnable").checked,
                sleep_range: {
                    start: document.getElementById("sleepStart").value,
                    end: document.getElementById("sleepEnd").value
                },
                mode: "all"
            };

            await fetch("/set_settings", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });

            alert("Settings saved!");
        }

        async function loadThemes() {
            const res = await fetch("/get_themes");
            const data = await res.json();
            const select = document.getElementById("themeSelect");
            select.innerHTML = "";

            data.themes.forEach(theme => {
                const option = document.createElement("option");
                option.value = theme;
                option.text = theme;
                select.appendChild(option);
            });
        }

        async function uploadImage() {
            const formData = new FormData();
            const fileInput = document.getElementById("fileInput");
            const theme = document.getElementById("themeSelect").value;

            formData.append("file", fileInput.files[0]);
            formData.append("theme", theme);

            const res = await fetch("/upload_image", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            alert("Uploaded: " + data.filename);
        }

        window.onload = async () => {
            await loadThemes();
            await loadSettings();
        };
    </script>
</head>
<body>
    <h1>LED Matrix Control</h1>

    <h2>Display Settings</h2>
    <label>Theme:</label>
    <select id="themeSelect"></select><br><br>

    <label>Image Duration (sec):</label>
    <input type="number" id="duration" value="2"><br><br>

    <label>Enable Sleep Mode:</label>
    <input type="checkbox" id="sleepEnable"><br><br>

    <label>Sleep Start (HH:MM):</label>
    <input type="time" id="sleepStart" value="00:00"><br>

    <label>Sleep End (HH:MM):</label>
    <input type="time" id="sleepEnd" value="09:00"><br><br>

    <button onclick="saveSettings()">💾 Save Settings</button>

    <h2>Upload Image</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadImage()">Upload</button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

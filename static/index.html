<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>LED Matrix Control</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<script>
			async function loadSettings() {
				const res = await fetch("/get_settings");
				const settings = await res.json();

				document.getElementById("themeSelect").value = settings.theme || "";
				document.getElementById("duration").value = settings.duration || 2;
				document.getElementById("sleepEnable").checked =
					settings.sleep_enable || false;
				document.getElementById("sleepStart").value =
					settings.sleep_range?.start || "00:00";
				document.getElementById("sleepEnd").value =
					settings.sleep_range?.end || "09:00";
			}

			async function saveSettings() {
				const payload = {
					theme: document.getElementById("themeSelect").value,
					duration: parseFloat(document.getElementById("duration").value),
					sleep_enable: document.getElementById("sleepEnable").checked,
					sleep_range: {
						start: document.getElementById("sleepStart").value,
						end: document.getElementById("sleepEnd").value,
					},
					mode: "all",
				};

				await fetch("/set_settings", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify(payload),
				});

				const alertBox = document.getElementById("alertBox");
				alertBox.classList.remove("d-none");
				setTimeout(() => alertBox.classList.add("d-none"), 3000);
			}

			async function loadThemes() {
				const res = await fetch("/get_themes");
				const data = await res.json();

				const selects = [
					document.getElementById("themeSelect"),
					document.getElementById("themeSelectUpload"),
				];

				selects.forEach((select) => {
					select.innerHTML = `<option value="">-- Select a Theme --</option>`;
					data.themes.forEach((theme) => {
						const option = document.createElement("option");
						option.value = theme;
						option.text = theme;
						select.appendChild(option);
					});

					// Add "Create New Theme" option at the end
					const createNewOption = document.createElement("option");
					createNewOption.value = "__new__";
					createNewOption.text = "➕ Create New Theme...";
					select.appendChild(createNewOption);
				});
			}

			async function uploadImage() {
				const fileInput = document.getElementById("fileInput");
				const themeSelect = document.getElementById("themeSelectUpload");
				const newThemeInput = document.getElementById("newThemeName");
				const formData = new FormData();

				if (!fileInput.files[0]) {
					alert("Please choose an image.");
					return;
				}

				formData.append("file", fileInput.files[0]);

				if (themeSelect.value === "__new__") {
					const newTheme = newThemeInput.value.trim();
					if (!newTheme) {
						alert("Please enter a name for the new theme.");
						return;
					}
					formData.append("new_theme", newTheme);
				} else if (themeSelect.value) {
					formData.append("theme", themeSelect.value);
				} else {
					alert("Please select a theme or create a new one.");
					return;
				}

				const res = await fetch("/upload_image", {
					method: "POST",
					body: formData,
				});

				const data = await res.json();
				alert("Uploaded to theme: " + data.theme);
				await loadThemes();
			}

			function toggleNewThemeInput() {
				const themeSelect = document.getElementById("themeSelectUpload");
				const newThemeWrapper = document.getElementById("newThemeWrapper");

				if (themeSelect.value === "__new__") {
					newThemeWrapper.classList.remove("d-none");
				} else {
					newThemeWrapper.classList.add("d-none");
					document.getElementById("newThemeName").value = "";
				}
			}

			window.onload = async () => {
				await loadThemes();
				await loadSettings();
			};
		</script>
	</head>
	<body class="bg-light py-4">
		<div class="container">
			<h1 class="mb-4">LED Matrix Control</h1>

			<div id="alertBox" class="alert alert-success d-none" role="alert">
				Settings saved successfully!
			</div>

			<div class="card mb-4">
				<div class="card-header">Display Settings</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Theme</label>
						<select id="themeSelect" class="form-select"></select>
					</div>
					<div class="mb-3">
						<label class="form-label">Image Duration (seconds)</label>
						<input
							type="number"
							id="duration"
							class="form-control"
							min="0.1"
							step="0.1"
						/>
					</div>
					<div class="form-check form-switch mb-3">
						<input class="form-check-input" type="checkbox" id="sleepEnable" />
						<label class="form-check-label" for="sleepEnable"
							>Enable Sleep Mode</label
						>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label">Sleep Start</label>
							<input type="time" id="sleepStart" class="form-control" />
						</div>
						<div class="col">
							<label class="form-label">Sleep End</label>
							<input type="time" id="sleepEnd" class="form-control" />
						</div>
					</div>
					<div class="mt-4">
						<button class="btn btn-primary w-100" onclick="saveSettings()">
							💾 Save Settings
						</button>
					</div>
				</div>
			</div>
			<div class="card mt-4">
				<div class="card-header">Upload Image to Theme</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Choose File</label>
						<input type="file" id="fileInput" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Theme</label>
						<select
							id="themeSelectUpload"
							class="form-select"
							onchange="toggleNewThemeInput()"
						>
							<option value="">-- Select a Theme --</option>
						</select>
					</div>
					<div class="mb-3 d-none" id="newThemeWrapper">
						<label class="form-label">New Theme Name</label>
						<input
							type="text"
							id="newThemeName"
							class="form-control"
							placeholder="e.g. space_cats"
						/>
					</div>
					<button class="btn btn-secondary w-100" onclick="uploadImage()">
						📤 Upload Image
					</button>
				</div>
			</div>
		</div>
	</body>
</html>

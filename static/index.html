<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>LED Matrix Control</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/static/style.css" />
	</head>
	<body class="py-4 dark-mode">
		<div class="container">
			<div class="d-flex justify-content-between align-items-center mb-4">
				<h1 class="mb-0">LED Matrix Control</h1>
				<button class="btn btn-sm btn-outline-light" onclick="toggleDarkMode()">
					🌓 Toggle Dark Mode
				</button>
			</div>

			<div id="alertBox" class="alert alert-success d-none" role="alert">
				Settings saved successfully!
			</div>

			<div class="card mb-4">
				<div class="card-header">Display Settings</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Theme</label>
						<select
							id="themeSelect"
							class="form-select"
							onchange="loadThemePreviews(this.value)"
						>
							<option value="">-- Select a Theme --</option>
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label">Static Image (optional)</label>
						<div id="imagePreviewGrid" class="row g-2"></div>
					</div>
					<div class="mb-3">
						<label class="form-label">Image Duration (seconds)</label>
						<input
							type="number"
							id="duration"
							class="form-control"
							min="0.1"
							step="0.1"
						/>
					</div>
					<div class="form-check form-switch mb-3">
						<input class="form-check-input" type="checkbox" id="sleepEnable" />
						<label class="form-check-label" for="sleepEnable"
							>Enable Sleep Mode</label
						>
					</div>
					<div class="row">
						<div class="col">
							<label class="form-label">Sleep Start</label>
							<input type="time" id="sleepStart" class="form-control" />
						</div>
						<div class="col">
							<label class="form-label">Sleep End</label>
							<input type="time" id="sleepEnd" class="form-control" />
						</div>
					</div>
					<div class="mt-4">
						<button class="btn btn-primary w-100" onclick="saveSettings()">
							💾 Save Settings
						</button>
					</div>
				</div>
			</div>

			<div class="card">
				<div class="card-header">Upload Image to Theme</div>
				<div class="card-body">
					<div class="mb-3">
						<label class="form-label">Choose File</label>
						<input type="file" id="fileInput" class="form-control" />
					</div>
					<div class="mb-3">
						<label class="form-label">Theme</label>
						<select
							id="themeSelectUpload"
							class="form-select"
							onchange="toggleNewThemeInput()"
						>
							<option value="">-- Select a Theme --</option>
						</select>
					</div>
					<div class="mb-3 d-none" id="newThemeWrapper">
						<label class="form-label">New Theme Name</label>
						<input
							type="text"
							id="newThemeName"
							class="form-control"
							placeholder="e.g. holidays"
						/>
					</div>
					<button class="btn btn-secondary w-100" onclick="uploadImage()">
						📤 Upload Image
					</button>
				</div>
			</div>
		</div>
		<script>
			function toggleDarkMode() {
				document.body.classList.toggle("dark-mode");
			}
		</script>
		<script src="/static/script.js"></script>
	</body>
</html>
